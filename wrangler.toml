# Cloudflare deployment.
#
# This is a static site: the build output in dist/ is the whole application. There
# is no server, no API and no environment to configure, because the radio is on the
# operator's own machine and the messages live in their browser.
#
# Cloudflare's Workers deploy needs to be told where the files are. The build output
# directory set in the dashboard is not passed to wrangler, which is why a deploy
# without this file fails with "the assets property is missing the required
# directory property" even though the build itself succeeded.

name = "meshcore-emcomm"
compatibility_date = "2026-09-20"

[assets]
# relative to this file, and matching build.outDir in vite.config.js, which writes
# to ../dist because vite's root is src/
directory = "./dist"
